name: builderYam

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  issue_comment:
    types: [created]
    
permissions:
  contents: write
  pull-requests: read
  
jobs:
  build:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: AlwaysInFocus.sln
      Project_Path: AlwaysInFocus/AlwaysInFocus.csproj

    steps:
    - name: 🏷 Resolve release metadata from comment
      if: github.event_name == 'issue_comment'
      id: release_meta
      uses: actions/github-script@v7
      with:
        script: |
          const body = (context.payload.comment?.body || '').trim();
          const isVersion = /^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(body);
          core.setOutput('should_release', isVersion ? 'true' : 'false');
          if (!isVersion) {
            return;
          }

          core.setOutput('version', body);
          const pullNumber = context.payload.issue?.number;
          if (pullNumber) {
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber
            });
            core.setOutput('target_sha', pr.head.sha);
          } else {
            core.setOutput('target_sha', context.sha);
          }

    - name: 📥 Checkout repository
      if: github.event_name != 'issue_comment' || steps.release_meta.outputs.should_release == 'true'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'issue_comment' && steps.release_meta.outputs.target_sha || github.ref }}

    - name: Print GitHub Ref
      if: github.event_name != 'issue_comment' || steps.release_meta.outputs.should_release == 'true'
      run: echo "GITHUB_REF is $GITHUB_REF"

    - name: 🛠 Install .NET 9 SDK
      if: github.event_name != 'issue_comment' || steps.release_meta.outputs.should_release == 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: 🛠 Setup MSBuild
      if: github.event_name != 'issue_comment' || steps.release_meta.outputs.should_release == 'true'
      uses: microsoft/setup-msbuild@v2

    - name: 🧪 Run unit tests
      if: github.event_name != 'issue_comment' || steps.release_meta.outputs.should_release == 'true'
      run: dotnet test

    - name: 🔧 Restore NuGet packages
      if: github.event_name != 'issue_comment' || steps.release_meta.outputs.should_release == 'true'
      run: dotnet publish $env:Project_Path -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=true /p:IncludeNativeLibrariesForSelfExtract=true

      
    - name: 🏗 Build the WPF project
      if: github.event_name != 'issue_comment' || steps.release_meta.outputs.should_release == 'true'
      run: dotnet publish $env:Project_Path -c ${{ matrix.configuration }} -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=true

    - name: 🗂 List output directory
      if: github.event_name != 'issue_comment' || steps.release_meta.outputs.should_release == 'true'
      run: dir AlwaysInFocus/bin/Release/net9.0-windows -Recurse

    - name: 📦 Upload build output
      if: github.event_name != 'issue_comment' || steps.release_meta.outputs.should_release == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AlwaysInFocus-Binaries
        path: AlwaysInFocus/bin/Release/net9.0-windows/win-x64/publish/*.exe
    
    - name: 🚀 Create GitHub Release
      if: github.event_name == 'issue_comment' && steps.release_meta.outputs.should_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ steps.release_meta.outputs.version }}
        tag_name: ${{ steps.release_meta.outputs.version }}
        target_commitish: ${{ steps.release_meta.outputs.target_sha }}
        files: AlwaysInFocus/bin/Release/net9.0-windows/win-x64/publish/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
